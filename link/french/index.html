<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Video Player</title>
    <style>
        /* Remove default margins and hide body scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        /* Force the video container to fill the entire viewport */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Style the iframe to eliminate gaps or borders */
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Google Drive embedded video link configured for full screen -->
        <iframe 
            src="https://drive.google.com/file/d/1RcaAkmKiFeTtSO0-PF8REbLSrDh8KpmG/preview" 
            allow="autoplay; fullscreen"
            allowfullscreen="true"
            webkitallowfullscreen="true" 
            mozallowfullscreen="true">
        </iframe>
    </div>

</body>
</html>
